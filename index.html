<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محمد أنور عمران | مرحباً</title>
  <meta name="description" content="الواجهة الرئيسية — محمد أنور يحي أحمد عمران. الدخول إلى الموقع أو لوحة التحكم." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#060b18" />
  <link rel="canonical" href="https://enmohammedanwr-coder.github.io/resume-website/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="محمد أنور عمران" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23060b18'/%3E%3Ctext x='50' y='70' font-size='56' font-family='Arial' font-weight='bold' fill='%2338bdf8' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- shared tokens (theme variables) + landing styles -->
  <link rel="stylesheet" href="assets/css/style.css?v=7" />
  <link rel="stylesheet" href="assets/css/landing.css?v=7" />
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- top bar: brand + theme/language -->
  <header class="land-top">
    <div class="land-brand">
      <span class="mono" aria-hidden="true">M</span>
      <span>
        محمد أنور عمران
        <small data-t="footer">جميع الحقوق محفوظة</small>
      </span>
    </div>
    <div class="land-actions">
      <button class="icon-btn" id="langToggle" type="button" data-t-aria="lang" aria-label="English">EN</button>
      <button class="icon-btn" id="themeToggle" type="button" data-t-aria="theme" aria-label="تبديل الوضع">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <!-- welcome card -->
  <main class="land-wrap">
    <section class="land-card" aria-labelledby="landName">
      <img class="land-photo" src="assets/img/profile.jpg" alt="محمد أنور عمران" />
      <p class="land-greet" data-t="greeting">مرحباً، أنا</p>
      <h1 class="land-name" id="landName">محمد أنور <span>عمران</span></h1>
      <p class="land-role" data-t="role">خريج نظم المعلومات الحاسوبية، مطوّر مواقع وتطبيقات، ومتخصص في قواعد البيانات وتقنية المعلومات.</p>

      <div class="land-cta">
        <a class="btn-land btn-land--primary" href="home">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 3 10v11h6v-6h6v6h6V10L12 3Z"/></svg>
          <span data-t="home">الرئيسية</span>
        </a>

        <!-- The dashboard entry is intentionally NOT advertised here. It is
             reached through the discreet corner dot or the keyboard shortcut,
             and /admin enforces password login on the server regardless. -->
      </div>
    </section>
  </main>

  <footer class="land-foot">
    © <span id="year">2026</span> محمد أنور عمران
  </footer>

  <!-- very low-opacity lock dot: a second, subtler way into the dashboard -->
  <button class="land-lock" id="adminLock" type="button" aria-label="دخول المشرف" title="دخول المشرف">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Z"/></svg>
  </button>

  <script src="assets/js/landing.js?v=7"></script>
</body>
</html>
